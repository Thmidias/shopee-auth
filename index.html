<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Movliv - API Callback</title>
  <style>
    body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f5f5f5; }
    .box { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); text-align: center; max-width: 600px; }
    h1 { color: #ee4d2d; }
    .code { background: #f0f0f0; padding: 12px; border-radius: 8px; font-family: monospace; word-break: break-all; margin: 16px 0; }
    .label { font-size: 12px; color: #888; margin-bottom: 4px; }
  </style>
</head>
<body>
  <div class="box">
    <h1>Autorizacao concluida!</h1>
    <p>Copie os valores abaixo e cole no Claude para finalizar a configuracao.</p>
    <div id="params"></div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const container = document.getElementById('params');
    if (params.toString()) {
      params.forEach((value, key) => {
        container.innerHTML += '<div class="label">' + key + '</div><div class="code">' + value + '</div>';
      });
    } else {
      container.innerHTML = '<p style="color:#888">Nenhum parametro encontrado na URL.</p>';
    }
  </script>
</body>
</html>
